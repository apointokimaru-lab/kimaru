<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>パスワード再設定 - キマル（新ルック探索）</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/mock.css" />
</head>
<body>
<!-- mock: プレースホルダ内容のみ（mock/README.md のルール参照）。 -->

<header class="nav">
  <div class="nav-in">
    <a class="brand" href="/"><span class="brand-dot"></span>キマル</a>
    <nav class="nav-links">
      <a href="/plan.html">料金</a>
      <a href="#">特長</a>
      <a href="#">使い方</a>
    </nav>
    <div style="display:flex;gap:10px;align-items:center">
      <a class="btn btn-ghost" href="/login.html" style="min-height:40px;padding:0 16px">ログイン</a>
      <a class="btn btn-primary" href="/signup.html" style="min-height:40px;padding:0 18px">無料で始める</a>
    </div>
  </div>
</header>

<main>
  <div class="authwrap">
    <div class="authcard">
      <h1>パスワード再設定</h1>
      <p class="sub">ご登録のメールアドレス宛に、再設定用のリンクをお送りします。</p>

      <form>
        <div class="field">
          <label for="email">メールアドレス</label>
          <input id="email" type="email" placeholder="you@example.com" autocomplete="email" />
          <span class="field-note">アカウントに登録したメールアドレスをご入力ください。</span>
        </div>
        <button class="btn btn-primary" type="submit">再設定メールを送る</button>
      </form>

      <p class="note" style="margin-top:18px">数分以内にメールが届きます。見当たらない場合は、迷惑メールフォルダもご確認ください。</p>

      <p class="auth-foot"><a href="/login.html">← ログインに戻る</a></p>
    </div>
  </div>
</main>

<footer class="foot">
  <div class="shell foot-in">
    <div><a href="/">キマル</a><a href="/plan.html">料金</a><a href="#">利用規約</a><a href="#">プライバシー</a></div>
    <div>© 2026 Kimaru — 日程が、キマる。</div>
  </div>
</footer>
</body>
</html>
