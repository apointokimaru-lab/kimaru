# CI（#413・段階0）。PR と main への push で、整形・lint・型検査・ビルド・テストを全部回す。
# なぜ: 現行リポジトリには CI が無く、規約（docs/frontend-conventions.md）を機械的に守る場所が無かった。
# 「赤の PR はマージしない」が運用（CLAUDE.md）。Netlify の本番ビルドはここではやらない（Deploy Preview が別に走る）。
name: CI

on:
  pull_request:
  push:
    branches: [main]

# 同じブランチで push が続いたら古い実行を止める（待ち時間と料金の節約）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: format / lint / typecheck / build / test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      # next build が .env を探しに行くが CI には無い。ルートハンドラだけなので環境変数は不要
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Netlify の本番ビルド（既定の Node）に合わせて 22 系。ローカルは 24 でも動く
          node-version: 22
          cache: npm

      - name: 依存関係（lockfile どおり）
        run: npm ci

      # ---- 規約の機械チェック（速いものから）----
      - name: Prettier
        run: npm run format:check
      - name: ESLint
        run: npm run lint
      - name: 型検査（next typegen + tsc）
        run: npm run typecheck

      # ---- ビルド（e2e は next start に対して回すので先に作る）----
      - name: next build
        run: npm run build

      # ---- テスト ----
      # Playwright のブラウザは版ごとにキャッシュ（毎回 100MB 超を落とさない）
      - name: Playwright の版を取る
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Chromium を入れる
        run: npx playwright install --with-deps chromium

      - name: "単体テスト（旧 scripts/test/unit.mjs ＋ 新 node:test）"
        run: npm run test:unit
      - name: "e2e（旧 scripts/test/e2e.mjs ＋ 新 @playwright/test）"
        run: npm run test:e2e

      - name: 失敗時に Playwright のレポートを残す
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
