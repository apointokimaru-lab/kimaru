<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>キマル - パスワード再設定</title>
  <link rel="stylesheet" href="/styles.css" />
  <script src="/page-busy.js"></script>
</head>
<body data-page="reset-password" data-i18n-title="reset.title">
  <!-- site-header -->

  <main>
    <div class="authwrap">
      <!-- 申請モード（トークンなし）: メールアドレスを入力して再設定リンクを送る -->
      <div class="authcard" id="request-panel">
        <h1 data-i18n="reset.request.heading">パスワード再設定</h1>
        <p class="sub" data-i18n="reset.request.sub">ご登録のメールアドレス宛に、再設定用のリンクをお送りします。</p>

        <form id="request-form">
          <div class="field">
            <label for="request-email" data-i18n="reset.email.label">メールアドレス</label>
            <input id="request-email" name="email" type="email" placeholder="you@example.com" autocomplete="email" data-i18n-placeholder="reset.email.placeholder" required />
            <span class="field-note" data-i18n="reset.email.note">アカウントに登録したメールアドレスをご入力ください。</span>
          </div>
          <button class="btn btn-primary" type="submit" data-i18n="reset.request.submit">再設定メールを送る</button>
        </form>

        <p id="request-message" class="message" role="status"></p>
        <p class="note" data-i18n="reset.request.hint">数分以内にメールが届きます。見当たらない場合は、迷惑メールフォルダもご確認ください。</p>

        <p class="auth-foot"><a href="/login.html" data-i18n="reset.backToLogin">← ログインに戻る</a></p>
      </div>

      <!-- 再設定モード（トークンあり）: 新しいパスワードを設定 -->
      <div class="authcard hidden" id="reset-panel">
        <h1 data-i18n="reset.set.heading">新しいパスワードを設定</h1>
        <p class="sub" data-i18n="reset.set.sub">新しいパスワード（8文字以上）を入力してください。</p>

        <form id="reset-form">
          <div class="field">
            <label for="reset-pw" data-i18n="reset.password.label">新しいパスワード</label>
            <input id="reset-pw" name="password" type="password" autocomplete="new-password" minlength="8" required />
          </div>
          <button class="btn btn-primary" type="submit" data-i18n="reset.set.submit">パスワードを変更する</button>
        </form>

        <p id="reset-message" class="message" role="status"></p>

        <p class="auth-foot"><a href="/login.html" data-i18n="reset.backToLogin">← ログインに戻る</a></p>
      </div>
    </div>
  </main>

  <!-- site-footer -->

  <script src="/i18n.js" defer></script>
  <script>
    const $ = (s) => document.querySelector(s);
    const params = new URLSearchParams(location.search);
    const id = params.get("id");
    const ts = params.get("ts");
    const t = params.get("t");
    const resetMode = Boolean(id && ts && t);

    $("#request-panel").classList.toggle("hidden", resetMode);
    $("#reset-panel").classList.toggle("hidden", !resetMode);

    $("#request-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const email = new FormData(event.currentTarget).get("email");
      const msg = $("#request-message");
      msg.textContent = "送信しています...";
      msg.className = "message";
      try {
        await fetch("/api/password-reset-request", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email }),
        });
        // 列挙対策のためサーバは常に成功を返す。メッセージも一律。
        msg.textContent = "ご登録のメールアドレス宛に再設定リンクをお送りしました（届かない場合は迷惑メールもご確認ください）。";
        msg.className = "message success";
      } catch (_) {
        msg.textContent = "ご登録のメールアドレス宛に再設定リンクをお送りしました。";
        msg.className = "message success";
      }
    });

    $("#reset-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const password = new FormData(event.currentTarget).get("password");
      const msg = $("#reset-message");
      msg.textContent = "変更しています...";
      msg.className = "message";
      try {
        const res = await fetch("/api/password-reset", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id, ts, t, password }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || "変更に失敗しました");
        msg.textContent = "パスワードを変更しました。ログインページに移動します...";
        msg.className = "message success";
        setTimeout(() => { location.href = "/login.html"; }, 1500);
      } catch (error) {
        msg.textContent = error.message;
        msg.className = "message error";
      }
    });
  </script>
</body>
</html>
