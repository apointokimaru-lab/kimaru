<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>キマル | 予約の確認・変更</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/booking-redesign.css" />
</head>
<body data-page="booking" data-i18n-title="mb.pageTitle">
  <!-- site-header -->

  <main class="shell narrow">
    <div class="pagehead">
      <span class="eyebrow" data-i18n="mb.eyebrow">Manage</span>
      <h1 id="manage-title" data-i18n="mb.loading">予約を読み込み中...</h1>
      <p class="sub muted" id="manage-sub"></p>
    </div>

    <section class="panel" style="margin-top:22px">
      <dl class="summary" id="manage-summary"></dl>
      <div class="form-actions" id="manage-actions" style="margin-top:20px" hidden>
        <button type="button" class="button primary" id="btn-reschedule" data-i18n="mb.btn.reschedule">日程を変更 →</button>
        <button type="button" class="button secondary danger" id="btn-cancel" data-i18n="mb.btn.cancel">キャンセルする</button>
      </div>
      <p class="note" style="margin-top:18px" data-i18n="mb.foot">キャンセル無料・ログイン不要・手続き後すぐ確認メールをお送りします。</p>
      <p id="manage-message" class="message" role="status"></p>
    </section>

    <!-- 日程変更 -->
    <section class="panel" id="reschedule-card" style="margin-top:18px" hidden>
      <span class="eyebrow" data-i18n="mb.rs.eyebrow">日程変更</span>
      <h2 data-i18n="mb.rs.heading">新しい日時を選ぶ</h2>
      <p class="muted" data-i18n="mb.rs.note">変更後の空き枠から選んでください。確定すると元の日程は解放されます。</p>
      <div id="rs-week-nav" class="week-nav" style="display:none">
        <button type="button" id="rs-prev" class="button secondary" data-i18n="booking.week.prev">← 前の週</button>
        <span id="rs-week-label"></span>
        <button type="button" id="rs-next" class="button secondary" data-i18n="booking.week.next">次の週 →</button>
      </div>
      <div id="rs-slots" class="rs-slots"></div>
      <div class="form-actions" style="margin-top:18px">
        <button type="button" class="button secondary" id="rs-back" data-i18n="mb.rs.back">← 戻る</button>
      </div>
      <p id="rs-message" class="message"></p>
    </section>
  </main>

  <!-- site-footer -->

  <script src="/i18n.js" defer></script>
  <script src="/week-table.js" defer></script>
  <script src="/manage-booking.js" defer></script>
</body>
</html>
