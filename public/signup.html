<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>無料で始める - キマル</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body data-page="signup" data-i18n-title="signup.pageTitle">
  <!-- site-header -->

  <main>
    <div class="authwrap">
      <div class="authcard">
        <p class="eyebrow" data-i18n="signup.eyebrow">無料アカウント</p>
        <h1 data-i18n="signup.heading">キマルをはじめる</h1>
        <p class="sub" data-i18n="signup.subtitle">30秒でアカウント作成。クレジットカード不要。</p>

        <div class="tag-row" style="display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px">
          <span class="tag" data-i18n="signup.tagFree">無料</span>
          <span class="tag" data-i18n="signup.tagNoCard">クレカ不要</span>
          <span class="tag" data-i18n="signup.tag30s">30秒で完了</span>
        </div>

        <a class="google-btn" href="/api/google-auth-start">
          <svg viewBox="0 0 18 18" width="18" height="18" aria-hidden="true">
            <path fill="#4285F4" d="M17.64 9.2045c0-.6381-.0573-1.2518-.1636-1.8409H9v3.4814h4.8436c-.2086 1.125-.8427 2.0782-1.7955 2.7164v2.2581h2.9087c1.7018-1.5668 2.6832-3.874 2.6832-6.615z"/>
            <path fill="#34A853" d="M9 18c2.43 0 4.4673-.806 5.9564-2.1818l-2.9087-2.2581c-.8059.54-1.8368.859-3.0477.859-2.344 0-4.3282-1.5831-5.036-3.7104H.9573v2.3318C2.4382 15.9832 5.4818 18 9 18z"/>
            <path fill="#FBBC05" d="M3.964 10.71c-.18-.54-.2823-1.1168-.2823-1.71s.1023-1.17.2823-1.71V4.9582H.9573C.3477 6.1732 0 7.5477 0 9s.3477 2.8268.9573 4.0418L3.964 10.71z"/>
            <path fill="#EA4335" d="M9 3.5795c1.3214 0 2.5077.4541 3.4405 1.346l2.5813-2.5814C13.4632.8918 11.426 0 9 0 5.4818 0 2.4382 2.0168.9573 4.9582L3.964 7.29C4.6718 5.1627 6.656 3.5795 9 3.5795z"/>
          </svg>
          <span data-i18n="auth.googleSignup">Googleで無料登録</span>
        </a>
        <p class="field-note" style="text-align:center;margin-top:8px" data-i18n="signup.googleNote">Googleカレンダー連携がそのまま使えるので、いちばんスムーズです。</p>

        <div class="auth-divider"><span data-i18n="signup.orEmail">またはメールで登録</span></div>

        <form id="signup-form">
          <div class="field">
            <label for="signup-name" data-i18n="signup.name">名前</label>
            <input id="signup-name" name="name" type="text" autocomplete="name" required />
          </div>
          <div class="field">
            <label for="signup-email" data-i18n="signup.email">メールアドレス</label>
            <input id="signup-email" name="email" type="email" autocomplete="email" required />
          </div>
          <div class="field">
            <label for="signup-password" data-i18n="signup.password">パスワード（8文字以上）</label>
            <input id="signup-password" name="password" type="password" autocomplete="new-password" minlength="8" required />
            <span class="field-note" data-i18n="signup.passwordHint">英字と数字を含む8文字以上で設定してください。</span>
          </div>
          <div class="field">
            <label for="signup-password-confirm" data-i18n="signup.passwordConfirm">パスワード（確認用）</label>
            <input id="signup-password-confirm" name="password_confirm" type="password" autocomplete="new-password" minlength="8" required />
            <span class="field-note" data-i18n="signup.confirmHint">確認のため、同じパスワードをもう一度入力してください。</span>
          </div>
          <div class="field">
            <label for="signup-purpose" data-i18n="signup.purpose">利用目的</label>
            <textarea id="signup-purpose" name="purpose" rows="3" data-i18n-placeholder="signup.purposePlaceholder"></textarea>
          </div>
          <div class="field">
            <label for="signup-language" data-i18n="signup.language">言語</label>
            <select id="signup-language" name="language" data-language-select></select>
          </div>
          <label class="checkrow">
            <input type="checkbox" />
            <span data-i18n="signup.agree">利用規約・プライバシーポリシーに同意します</span>
          </label>
          <button class="primary" type="submit" style="margin-top:16px" data-i18n="signup.submit">無料アカウントを作成</button>
          <p class="field-note" style="margin-top:10px" data-i18n="signup.catkeyNote">招待コード（Cat Key）をお持ちの方は登録後に入力できます。</p>
        </form>
        <p id="signup-message" class="message" role="status"></p>

        <p class="auth-foot"><span data-i18n="signup.haveAccount">すでにアカウントをお持ちの方は</span> <a href="/login.html" data-i18n="signup.login">ログイン</a></p>
        <p class="field-note" style="text-align:center;margin-top:14px" data-i18n="signup.footNote">登録は無料です。営業メールは送りません。いつでも退会できます。</p>
      </div>
    </div>
  </main>

  <!-- site-footer -->

  <script src="/i18n.js" defer></script>
  <script src="/app.js" defer></script>
</body>
</html>
