<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="guide.pageTitle">キマル - 使い方ガイド</title>
  <link rel="stylesheet" href="/styles.css" />
  <script src="/page-busy.js"></script>
</head>
<body data-page="guide" data-i18n-title="guide.pageTitle">
  <!-- site-header -->

  <main>
    <section class="section shell" style="padding-top:0">
      <div class="pagehead">
        <span class="eyebrow" data-i18n="guide.index.eyebrow">使い方ガイド</span>
        <h1 data-i18n="guide.index.heading">機能別の操作手順</h1>
        <p class="sub" data-i18n="guide.index.lead">各機能について、概要・設定手順・設定項目の意味を項目別に記載しています。知りたい項目を選ぶと、詳細が表示されます。</p>
      </div>

      <!-- 機能一覧は guide.js の ENTRIES / GROUPS から組む（このHTMLに項目名を書かない）。
           2か所に項目名を持つと、説明を1つ足したときに必ず片方が古くなるため。
           JSが動かない環境ではここが空になるが、ガイドは操作の説明で、読めなくても
           サービスは使える（＝degrade して構わない）ものとして扱う。 -->
      <div class="guide-index" data-guide-index></div>
    </section>
  </main>

  <!-- site-footer -->

  <!-- i18n.js を先に置く：guide.js は描画時に t() を使うので、言語が確定してから組ませる。 -->
  <script src="/i18n.js" defer></script>
  <script src="/guide.js" defer></script>
</body>
</html>
