<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ログイン - キマル（新ルック探索）</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/mock.css" />
</head>
<body>
<!-- mock: プレースホルダ内容のみ（mock/README.md のルール参照）。 -->

<header class="nav">
  <div class="nav-in">
    <a class="brand" href="/"><span class="brand-dot"></span>キマル</a>
    <nav class="nav-links">
      <a href="/plan.html">料金</a>
      <a href="#">特長</a>
      <a href="#">使い方</a>
    </nav>
    <div style="display:flex;gap:10px;align-items:center">
      <a class="btn btn-ghost" href="/login.html" style="min-height:40px;padding:0 16px">ログイン</a>
      <a class="btn btn-primary" href="/signup.html" style="min-height:40px;padding:0 18px">無料で始める</a>
    </div>
  </div>
</header>

<main>
  <div class="authwrap">
    <div class="authcard">
      <h1>おかえりなさい</h1>
      <p class="sub">キマルにログインして、続きから。</p>

      <button class="google-btn" type="button">Googleでログイン</button>

      <div class="divider">または メールアドレスで</div>

      <form>
        <div class="field">
          <label for="email">メールアドレス</label>
          <input id="email" type="email" placeholder="you@example.com" autocomplete="email" />
        </div>
        <div class="field">
          <div class="row-between" style="gap:8px">
            <label for="password">パスワード</label>
            <a href="/reset-password.html" style="font-size:12.5px;font-weight:700;color:var(--accent-ink)">お忘れですか？</a>
          </div>
          <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" />
        </div>
        <label class="checkrow" style="margin-bottom:14px"><input type="checkbox" checked /> ログイン状態を保持する</label>
        <button class="btn btn-primary" type="submit">ログイン</button>
      </form>

      <p class="auth-foot">アカウントがない方は <a href="/signup.html">無料で新規登録</a></p>
      <p class="auth-foot muted" style="font-size:12px;margin-top:10px">🔒 通信は暗号化され、安全に保護されています。</p>
    </div>
  </div>
</main>

<footer class="foot">
  <div class="shell foot-in">
    <div><a href="/">キマル</a><a href="/plan.html">料金</a><a href="#">利用規約</a><a href="#">プライバシー</a></div>
    <div>© 2026 Kimaru — 日程が、キマる。</div>
  </div>
</footer>
</body>
</html>
