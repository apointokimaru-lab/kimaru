<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="nf.pageTitle">キマル - ページが見つかりません</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<!-- Netlify が未マッチのURLに返す 404 ページ（設定不要・ファイル名で決まる）。
     受付停止中の予約ページからも booking-week.js がここへ飛ばす（#321）。
     「一時的に止まっている」と書くと相手が待ってしまうので、見つからない事実だけを伝える。 -->
<body data-page="not-found" data-i18n-title="nf.pageTitle">
  <!-- site-header -->

  <main class="shell">
    <section class="panel" style="max-width:560px;margin:48px auto;text-align:center">
      <p class="eyebrow" data-i18n="nf.eyebrow">404</p>
      <h1 data-i18n="nf.heading">ページが見つかりません</h1>
      <p class="lead" data-i18n="nf.desc">URLが変わったか、公開が終了した可能性があります。お心当たりのある方は、リンクの送り主にご確認ください。</p>
      <div class="actions" style="justify-content:center;margin-top:18px">
        <a class="button primary" href="/" data-i18n="nf.goTop">トップへ戻る</a>
      </div>
    </section>
  </main>

  <!-- site-footer -->

  <script src="/i18n.js" defer></script>
</body>
</html>
