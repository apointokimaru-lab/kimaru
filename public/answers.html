<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>キマル - 事前アンケート回答</title>
  <link rel="stylesheet" href="/styles.css" />
  <script src="/page-busy.js"></script>
</head>
<body data-page="answers" data-i18n-title="ans.pageTitle">
<!-- site-header -->

<main class="shell">
  <button class="backlink" type="button" onclick="location.href='/dashboard.html'" data-i18n="ans.back">← ホームへ戻る</button>

  <div class="pagehead" style="margin-top:8px">
    <span class="eyebrow" data-i18n="ans.eyebrow">面談前の準備</span>
    <h1 data-i18n="ans.heading">事前アンケート回答</h1>
    <p class="sub" data-i18n="ans.sub">予約時に相手が答えた内容を、面談前に確認できます。会う前に相手の関心を押さえて、当日をスムーズに。</p>
  </div>

  <div class="crm-toolbar" style="margin-top:24px">
    <span class="crm-count">
      <span data-i18n="ans.countUnread">未読</span>
      <b id="unread-count" style="color:var(--accent)">0</b><span data-i18n="ans.countUnit">件</span>
      <span class="muted"> / <b id="total-count">0</b><span data-i18n="ans.countUnit">件</span></span>
    </span>
    <span style="flex:1"></span>
    <button class="btn btn-ghost btn-sm filter-btn on" type="button" data-filter="all" data-i18n="ans.filterAll">すべて</button>
    <button class="btn btn-ghost btn-sm filter-btn" type="button" data-filter="unread" data-i18n="ans.filterUnread">未読のみ</button>
  </div>

  <div id="ans-list" style="margin-top:18px"></div>

  <p class="field-note" id="empty-note" style="margin-top:18px;display:none" data-i18n="ans.empty">未読のアンケート回答はありません。</p>
</main>

<!-- site-footer -->

<script src="/i18n.js" defer></script>
<script src="/plan.js" defer></script>
<script src="/app.js" defer></script>
</body>
</html>
