<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="sched.pageTitle">キマル - 週間スケジュール</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body data-page="schedule" data-i18n-title="sched.pageTitle">
  <!-- site-header -->

  <main class="shell" style="padding-bottom:64px">
    <div class="pagehead">
      <span class="eyebrow" data-i18n="sched.eyebrow">ホーム / スケジュール</span>
      <h1 data-i18n="sched.title">週間スケジュール</h1>
      <p class="sub" data-i18n="sched.sub">あなたの予約を1週間でまとめて確認できます。Googleカレンダーの予定と合わせて表示します。</p>
    </div>

    <div class="week-bar">
      <div class="week-range" id="weekRange">2026年 6月16日 — 22日</div>
      <div class="week-nav">
        <button class="btn btn-ghost btn-sm" type="button" id="weekPrev" data-i18n="sched.prev">◀ 前週</button>
        <button class="btn btn-ghost btn-sm" type="button" id="weekToday" data-i18n="sched.today">今日</button>
        <button class="btn btn-ghost btn-sm" type="button" id="weekNext" data-i18n="sched.next">次週 ▶</button>
        <a class="btn btn-ghost btn-sm" href="/dashboard.html" data-i18n="sched.toDashboard">今日の予定へ</a>
      </div>
    </div>

    <div class="week-grid" id="week-grid"></div>
  </main>

  <!-- site-footer -->

  <script src="/plan.js" defer></script>
  <script src="/i18n.js" defer></script>
  <script src="/app.js" defer></script>
</body>
</html>
