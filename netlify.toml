# 2026-09 から旧サイト（public/ の静的 HTML）と Next.js を同居させ、ページ単位で移行中（#412・親 #406〜#411）。
# - publish は Next.js の出力（.next）。public/ は Next の静的フォルダとして同じ URL でそのまま配信される
# - /api/* の Functions と Edge（auth-gate.js）は従来どおり。下の [[redirects]] もユーザー定義として
#   Next.js ランタイムの内部ルールより優先される（/b/* → /booking.html 等が今までどおり効く理由）
# - Next.js（関数）の応答には下の [[headers]] が付かないため、同じ値を next.config.ts でも付けている
[build]
  command = "npm run build"
  publish = ".next"
  functions = "netlify/functions"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# npm run dev（netlify dev）の裏で起動する開発サーバを固定する。
# 自動検出に任せると package.json の start スクリプト（本番サーバ・PORT を無視）を選んでしまい、
# 「Waiting for Next.js dev server on port …」のまま起動に失敗する。
[dev]
  command = "npm run dev:next"
  targetPort = 3000
  port = 8888
  framework = "#custom"
  # netlify dev は「/b/* → /booking.html」のような静的ファイルへの書き換え先を、この publish の中で探す
  # （本番では public/ が CDN の静的資産になるので同じ意味）。既定の .next のままだと見つからず、
  # 予約ページ /b/<slug> がローカルだけ 404 になる。
  publish = "public"

[functions]
  node_bundler = "esbuild"
  # nodemailer は動的requireを含むためバンドルせず node_module として同梱（Gmail SMTP送信用）
  external_node_modules = ["nodemailer"]

# 定期実行ジョブ（Netlify Scheduled Functions, cron はUTC）
[functions."reminder-scheduled"]
  schedule = "*/5 * * * *"   # 約5分間隔（予約22分前リマインダー）

# 期限切れのピンポイントリンクの押さえ予定を片付ける（#326）。
# リマインダーと違って分単位の精度は要らない（押さえが数十分残っても実害が無い）ので1時間ごと。
# dry-run 確認は /api/pinpoint-expire?dry_run=1
[functions."pinpoint-expire-scheduled"]
  schedule = "0 * * * *"     # 毎時0分

# 打ち合わせ後の営業メール（前日面談の未登録者へサンキュー＋登録案内・#181）は一旦停止中（2026-06-26）。
# 自動送信トリガーの cron を無効化。関数自体（thankyou-mails.js / thankyou-scheduled.js）は残してあり、
# 再開するにはこのブロックのコメントを外す（dry-run 確認は /api/thankyou-mails?dry_run=1）。
# [functions."thankyou-scheduled"]
#   schedule = "0 1 * * *"     # 毎日 UTC01:00 = JST10:00（前日面談の未登録者へサンキュー＋登録案内・#181）

# 誕生日メールの自動送信は廃止（決定17・#180）。生年月日入力と占いベース相手分析は継続。

# OAuth メタデータ（MCPコネクタの自動発見・RFC 9728/8414。パス接尾辞つき要求にも対応）
[[redirects]]
  from = "/.well-known/oauth-protected-resource"
  to = "/.netlify/functions/oauth-metadata?doc=resource"
  status = 200

[[redirects]]
  from = "/.well-known/oauth-protected-resource/*"
  to = "/.netlify/functions/oauth-metadata?doc=resource"
  status = 200

[[redirects]]
  from = "/.well-known/oauth-authorization-server"
  to = "/.netlify/functions/oauth-metadata?doc=server"
  status = 200

[[redirects]]
  from = "/.well-known/oauth-authorization-server/*"
  to = "/.netlify/functions/oauth-metadata?doc=server"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# ↓ /b/* /p/* /u/* の 3 つに force = true を付けている理由（#412）: netlify dev はフレームワーク（Next.js dev）が
#   居る構成では「強制でない静的ファイルへの書き換え」をローカルだけ適用しない（CLI の proxy.js の条件
#   `!options.framework && destStaticFile`）。これらのパスに実ファイルは存在しないので、本番 CDN での意味は変わらない。
[[redirects]]
  from = "/b/*"
  to = "/booking.html"
  status = 200
  force = true

# ピンポイント日程調整リンク（#303）。/p/<token> も booking.html を使う。
# 候補の出し方（週表→ラジオ一覧）だけ差し替え、質問・確認・完了は通常の予約と同じ画面を通す。
# token は JS がパスから読む。
[[redirects]]
  from = "/p/*"
  to = "/booking.html"
  status = 200
  force = true

[[redirects]]
  from = "/u/*"
  to = "/public-profile.html"
  status = 200
  force = true

# 旧 Pro 紹介ページ。料金ページは #419 で Next の /plan に移ったので、/plan.html を経由せず 1 段で送る
[[redirects]]
  from = "/pro.html"
  to = "/plan"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # HTTPS 強制（1年・サブドメイン含む）。preload は不可逆なので付けない（必要なら追加）。
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # 使わない強力機能を無効化。
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()"
    # CSP: ノービルドでインラインscriptが多いため script/style は 'unsafe-inline'（nonce化はビルド導入時に）。
    # それでも frame-ancestors/object-src/base-uri/form-action と外部オリジン制限で防御を強化。
    # 外部許可: Google Fonts(style/font)、画像は https 全般（Googleアバター等）。fetch は同一オリジンのみ。
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; upgrade-insecure-requests"
